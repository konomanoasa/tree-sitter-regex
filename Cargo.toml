[package]
name = "konomanoasa-tree-sitter-regex"
version = "0.6.0"
edition = "2024"
description = "Tree-sitter grammars for JavaScript regex, Python re, and POSIX BRE/ERE."
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-regex"
license = "MIT"
build = "bindings/rust/build.rs"
links = "tree-sitter-regex"
include = [
  "/*/queries/*.scm",
  "/*/src/*.c",
  "/*/src/node-types.json",
  "/*/src/tree_sitter/*.h",
  "/LICENSE",
  "/LICENSE-UNICODE",
  "/README.md",
  "/bindings/rust/*.rs",
  "/common/**/*.h",
  "/test/bindings.test.rs",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[dev-dependencies]
tree-sitter = "0.27.0"

[build-dependencies]
cc = "1.4"
