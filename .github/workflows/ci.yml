name: CI

on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Check source and generated parsers
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: brew install llvm
      - run: npm ci
      - name: Check source and generated parsers
        shell: sh
        run: |
          CC="$(brew --prefix llvm)/bin/clang"
          CFLAGS="-std=c17 -isysroot $(xcrun --sdk macosx --show-sdk-path)"
          export CC CFLAGS
          npm run check

  parser:
    name: Test all five regex parsers
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: tree-sitter/setup-action/cli@v2
      - run: npm ci
      - uses: tree-sitter/parser-test-action@v3
        with:
          generate: false
          test-parser-cmd: npm test

  query:
    name: Validate queries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: tree-sitter/setup-action/cli@v2
      - name: Build all five regex parsers
        shell: sh
        run: |
          for grammar in javascript_regex*/ python_re*/; do
            tree-sitter build "$grammar" --output "${grammar%/}.so" || exit 1
          done
      - name: Set up ts_query_ls
        run: >-
          curl -fL
          https://github.com/ribru17/ts_query_ls/releases/latest/download/ts_query_ls-x86_64-unknown-linux-gnu.tar.gz
          | tar -xz
      - name: Validate regex queries
        run: >-
          ./ts_query_ls check -f javascript_regex*/queries python_re*/queries
          --config
          '{"parser_install_directories":["."],"language_retrieval_patterns":["([^/]+)/queries/[^/]+[.]scm$"]}'
