[package]
name = "konomanoasa-tree-sitter-regex"
version = "0.9.0"
edition = "2024"
description = "Tree-sitter grammars for JavaScript regex, PCRE2, POSIX BRE/ERE, and Python re."
readme = "README.md"
repository = "https://github.com/konomanoasa/tree-sitter-regex"
license = "MIT"
build = "bindings/rust/build.rs"
links = "tree-sitter-regex"
include = [
  "/LICENSE",
  "/LICENSE-UNICODE",
  "/README.md",
  "/bindings/rust/*.rs",
  "/javascript/**/queries/*.scm",
  "/javascript/**/src/*.c",
  "/javascript/**/src/node-types.json",
  "/javascript/**/src/tree_sitter/*.h",
  "/javascript/common/*.h",
  "/pcre2/queries/*.scm",
  "/pcre2/src/*.c",
  "/pcre2/src/node-types.json",
  "/pcre2/src/tree_sitter/*.h",
  "/posix/**/queries/*.scm",
  "/posix/**/src/*.c",
  "/posix/**/src/node-types.json",
  "/posix/**/src/tree_sitter/*.h",
  "/posix/common/*.h",
  "/python/**/queries/*.scm",
  "/python/**/src/*.c",
  "/python/**/src/node-types.json",
  "/python/**/src/tree_sitter/*.h",
  "/python/common/*.h",
  "/test/bindings.test.rs",
]

[lib]
path = "bindings/rust/lib.rs"

[[test]]
name = "bindings"
path = "test/bindings.test.rs"

[dependencies]
tree-sitter-language = "0.1.8"

[dev-dependencies]
tree-sitter = "0.27.0"

[build-dependencies]
cc = "1.4"
